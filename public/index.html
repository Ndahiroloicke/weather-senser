<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Monitor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.1.3/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --bg-primary: #0F172A;
            --bg-secondary: #1E293B;
            --accent-blue: #3B82F6;
            --accent-purple: #8B5CF6;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --success: #22C55E;
            --error: #EF4444;
            --card-bg: #1E293B;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem 0;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--bg-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        .status-dot.error {
            background: var(--error);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
        }

        .chart-card {
            grid-column: span 8;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .metrics-container {
            grid-column: span 4;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .metric-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .metric-title {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .metric-icon {
            color: var(--text-secondary);
            font-size: 1.25rem;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 600;
            margin: 0.5rem 0;
        }

        .metric-unit {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-left: 0.25rem;
        }

        .metric-stats {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .chart-title {
            font-size: 1.125rem;
            font-weight: 500;
        }

        .chart-container {
            height: 400px;
            width: 100%;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @media (max-width: 1024px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .chart-card, .metrics-container {
                grid-column: span 1;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-title">
                <h1>Environmental Monitor</h1>
                <p>Real-time sensor data dashboard</p>
            </div>
            <div class="connection-status">
                <div class="status-indicator">
                    <div id="db-pulse" class="status-dot"></div>
                    <span id="db-status">Connected</span>
                </div>
                <div class="status-indicator">
                    <i class="fas fa-clock"></i>
                    <span id="last-update">Updated: Just now</span>
                </div>
            </div>
        </header>

        <div class="grid-container">
            <div class="chart-card">
                <div class="chart-header">
                    <h2 class="chart-title">Environmental Trends</h2>
                </div>
                <div class="chart-container">
                    <canvas id="weatherChart"></canvas>
                </div>
            </div>

            <div class="metrics-container">
                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-title">Temperature</span>
                        <i class="fas fa-temperature-high metric-icon"></i>
                    </div>
                    <div class="metric-value">
                        <span id="temp">--</span>
                        <span class="metric-unit">°C</span>
                    </div>
                    <div class="metric-stats">
                        <i class="fas fa-chart-line"></i>
                        Average: <span id="avg-temp">--</span>°C
                    </div>
                </div>

                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-title">Humidity</span>
                        <i class="fas fa-tint metric-icon"></i>
                    </div>
                    <div class="metric-value">
                        <span id="humidity">--</span>
                        <span class="metric-unit">%</span>
                    </div>
                    <div class="metric-stats">
                        <i class="fas fa-chart-line"></i>
                        Average: <span id="avg-humidity">--</span>%
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize chart with custom styling
        const ctx = document.getElementById('weatherChart').getContext('2d');
        Chart.defaults.color = 'rgba(255, 255, 255, 0.7)';
        Chart.defaults.font.family = "'Inter', sans-serif";
        
        const weatherChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Temperature (°C)',
                        borderColor: '#ff7e5f',
                        backgroundColor: 'rgba(255, 126, 95, 0.2)',
                        borderWidth: 3,
                        pointBackgroundColor: '#ff7e5f',
                        pointBorderColor: 'rgba(255, 255, 255, 0.8)',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        tension: 0.4,
                        data: [],
                        yAxisID: 'y'
                    },
                    {
                        label: 'Humidity (%)',
                        borderColor: '#00f2fe',
                        backgroundColor: 'rgba(0, 242, 254, 0.2)',
                        borderWidth: 3,
                        pointBackgroundColor: '#00f2fe',
                        pointBorderColor: 'rgba(255, 255, 255, 0.8)',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        tension: 0.4,
                        data: [],
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            padding: 20,
                            usePointStyle: true,
                            pointStyle: 'circle',
                            font: {
                                size: 12
                            }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.7)',
                        titleFont: {
                            size: 13
                        },
                        bodyFont: {
                            size: 13
                        },
                        padding: 10,
                        cornerRadius: 8,
                        displayColors: true
                    }
                },
                scales: {
                    x: {
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)',
                            borderColor: 'rgba(255, 255, 255, 0.2)'
                        },
                        ticks: {
                            font: {
                                size: 11
                            }
                        },
                        title: {
                            display: true,
                            text: 'Time',
                            font: {
                                size: 13
                            }
                        }
                    },
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: {
                            display: true,
                            text: 'Temperature (°C)',
                            font: {
                                size: 13
                            }
                        },
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)',
                            borderColor: 'rgba(255, 255, 255, 0.2)'
                        },
                        min: 0,
                        max: 50
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: {
                            display: true,
                            text: 'Humidity (%)',
                            font: {
                                size: 13
                            }
                        },
                        min: 0,
                        max: 100,
                        grid: {
                            drawOnChartArea: false,
                            borderColor: 'rgba(255, 255, 255, 0.2)'
                        }
                    }
                },
                animations: {
                    tension: {
                        duration: 1000,
                        easing: 'linear'
                    }
                }
            }
        });

        // Check for most recent data immediately
        function fetchCurrentReadings() {
            axios.get('/api/weather/current')
                .then(response => {
                    const data = response.data;
                    if (data) {
                        if (data.temperature !== undefined) {
                            document.getElementById("temp").innerText = data.temperature.toFixed(1);
                        }
                        if (data.humidity !== undefined) {
                            document.getElementById("humidity").innerText = data.humidity.toFixed(1);
                        }
                    }
                })
                .catch(error => {
                    console.error('Error fetching current readings:', error);
                });
        }

        // Function to update the chart with 5-minute interval data
        function updateChartWithHistoricalData() {
            axios.get('/api/weather/history')
                .then(response => {
                    const data = response.data;
                    
                    if (data.length > 0) {
                        document.getElementById("db-status").textContent = "Connected, storing data";
                        document.getElementById("db-status").style.color = "#00FF7F";
                        document.getElementById("db-pulse").classList.remove("error");
                    }
                    
                    // Clear existing data
                    weatherChart.data.labels = [];
                    weatherChart.data.datasets[0].data = [];
                    weatherChart.data.datasets[1].data = [];
                    
                    // Add historical data points
                    data.forEach(point => {
                        const timestamp = new Date(point.timestamp).toLocaleTimeString();
                        weatherChart.data.labels.push(timestamp);
                        weatherChart.data.datasets[0].data.push(point.avg_temperature);
                        weatherChart.data.datasets[1].data.push(point.avg_humidity);
                    });
                    
                    // Update average displays
                    if (data.length > 0) {
                        const latest = data[data.length - 1];
                        document.getElementById("avg-temp").innerText = latest.avg_temperature !== null ? latest.avg_temperature.toFixed(1) : "--";
                        document.getElementById("avg-humidity").innerText = latest.avg_humidity !== null ? latest.avg_humidity.toFixed(1) : "--";
                        document.getElementById("last-update").innerText = new Date().toLocaleTimeString();
                    }
                    
                    weatherChart.update();
                })
                .catch(error => {
                    console.error('Error fetching historical data:', error);
                    document.getElementById("db-status").textContent = "Error connecting to database";
                    document.getElementById("db-status").style.color = "#FF3030";
                    document.getElementById("db-pulse").classList.add("error");
                });
        }

        // Connect to the MQTT Broker over WebSockets
        const mqttClient = mqtt.connect('ws://157.173.101.159:9001');

        mqttClient.on('connect', () => {
            console.log("Connected to MQTT via WebSockets");
            mqttClient.subscribe("/work_group_01/room_temp/temperature");
            mqttClient.subscribe("/work_group_01/room_temp/humidity");
        });

        mqttClient.on('message', (topic, message) => {
            console.log(`Received: ${topic} → ${message.toString()}`);
            const value = parseFloat(message.toString());
            
            // Update the display with animation
            if (topic === "/work_group_01/room_temp/temperature") {
                const tempElement = document.getElementById("temp");
                animateValue(tempElement, parseFloat(tempElement.innerText) || 0, value, 1000);
                
                // Send to backend to store in SQLite
                axios.post('/api/weather/data', {
                    type: 'temperature',
                    value: value,
                    timestamp: new Date().toISOString()
                }).catch(error => console.error('Error storing temperature:', error));
                
            } else if (topic === "/work_group_01/room_temp/humidity") {
                const humidityElement = document.getElementById("humidity");
                animateValue(humidityElement, parseFloat(humidityElement.innerText) || 0, value, 1000);
                
                // Send to backend to store in SQLite
                axios.post('/api/weather/data', {
                    type: 'humidity',
                    value: value,
                    timestamp: new Date().toISOString()
                }).catch(error => console.error('Error storing humidity:', error));
            }
        });

        // Animate value change function
        function animateValue(element, start, end, duration) {
            if (isNaN(start)) start = 0;
            if (isNaN(end)) return;
            
            const range = end - start;
            let current = start;
            const increment = end > start ? 0.1 : -0.1;
            const stepTime = Math.abs(Math.floor(duration / (range / increment)));
            
            const timer = setInterval(function() {
                current += increment;
                element.innerText = current.toFixed(1);
                
                if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                    element.innerText = end.toFixed(1);
                    clearInterval(timer);
                }
            }, stepTime);
        }

        // Fetch current readings on load
        fetchCurrentReadings();

        // Update chart with historical data regularly
        updateChartWithHistoricalData(); // Initial load
        setInterval(updateChartWithHistoricalData, 30000); // Then every 30 seconds
    </script>
</body>
</html>
